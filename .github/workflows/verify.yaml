name: Verify overlays

# Keeps main green: the app repo's ci.yml publish job pushes image-tag bumps
# straight to main (PAT), so every push and PR is validated here. ArgoCD then
# deploys whatever main renders.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: latest
      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: v5.4.3
      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Helm lint
        run: helm lint charts/eas-weather-rs
      - name: Render and schema-validate the chart for every overlay
        run: |
          for env in base dev prod staging; do
            echo "==> $env"
            kustomize build "overlays/$env" \
              --enable-helm --load-restrictor=LoadRestrictionsNone \
              | kubeconform -summary
          done
name: Bump overlay image tag

# Triggered by the eas-weather-rs app repo after it publishes an image. Bumps
# `valuesInline.image.tag` in the target overlay and pushes to main. The app
# repo must call this via a PAT with `repo` scope (secrets.EWRS_DEPLOY_REPO_PAT):
#   gh api -X POST repos/shyuen/eas-weather-rs-k8s/dispatches \
#     -f event_type=deploy \
#     -F "client_payload[env]=dev" \
#     -F "client_payload[tag]=dev-<sha>"
on:
  repository_dispatch:
    types: [deploy]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      ENV: ${{ github.event.client_payload.env }}
      TAG: ${{ github.event.client_payload.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate target environment
        run: |
          case "${ENV}" in
            dev|staging|prod) ;;
            *) echo "refusing to touch unknown overlay: ${ENV}"; exit 1 ;;
          esac
      - name: Bump image tag in overlay
        run: |
          FILE="overlays/${ENV}/kustomization.yaml"
          sed -i "s/^        tag: .*/        tag: ${TAG}/" "${FILE}"
          git diff -- "${FILE}"
      - name: Commit and push
        run: |
          git config user.name "GitHub CD bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "overlays/${ENV}/kustomization.yaml"
          git commit -m "Bump ${ENV} image tag to ${TAG}"
          git push origin main
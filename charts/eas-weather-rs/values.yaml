replicaCount: 1

image:
  # Both the server and migrate binaries live in this single image.
  repository: eas-weather-rs
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

migrate:
  # Run `eas-weather-rs-migrate` as an init container before the server starts.
  enabled: true

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Secret file mount. The app reads sensitive config from files (password file paths)
# rather than env vars, so an existing k8s Secret is mounted as a volume.
# Create that Secret out-of-band (e.g. External Secrets Operator) with the keys
# configured below. Example:
#   kubectl create secret generic eas-weather-rs-secrets \
#     --from-literal=conn_url=mysql://user:pass@host:3306/eas_weather
secrets:
  secretName: eas-weather-rs-secrets
  connUrlKey: conn_url
  apiKeyKey: api_key
  jwtKeyKey: jwt_key
  mountPath: /etc/eas

# Application configuration. Rendered to a config.toml ConfigMap, mounted read-only for
# BOTH the migrate init-container and the server container, and loaded via
# EAS_WEATHER_RS__APP__CONFIG_FILE. The app merges it section-by-section over its own
# config/default.toml, so only keys set here override app defaults - the full app config
# surface (webserver, logging, database) is available without chart template changes.
# Key names must match the app's config.toml keys (snake_case).
config:
  logging:
    format: text
    trace_level: info
  webserver:
    hostname: "0.0.0.0"
    base_path: /
    shutdown_timeout_secs: 5
    default_page_limit: 10
    page_limit_max: 100
  database:
    conn_retry_init_delay_secs: 1
    conn_acquire_timeout_secs: 5
    min_connections: 1
    max_connections: 151

# Where the rendered config.toml is mounted and how the app is told to load it.
# Do NOT set webserver.api_key_file / webserver.jwt_key_file / database.conn_url_file in
# `config:` above - those secret file paths are injected from `secrets:` and only paths
# (never secret values) end up in the ConfigMap.
configFile:
  name: config.toml
  mountPath: /etc/ewrs

# Kubernetes health probes, pointed at the app's /health/* routes. These need
# no API key (only /conf/* routes are authenticated). Probe paths are composed
# under config.webserver.base_path (default / -> /health/startup, etc.).
probes:
  startup:
    enabled: true
    path: /health/startup
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 30
  liveness:
    enabled: true
    path: /health/liveness
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  readiness:
    enabled: true
    path: /health/readiness
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3

resources: {}

extraEnv: []
#  - name: EAS_WEATHER_RS__LOGGING__TRACE_LEVEL
#    value: debug

nodeSelector: {}
tolerations: []
affinity: {}
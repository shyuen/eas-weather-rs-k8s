apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eas-weather-rs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eas-weather-rs.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "eas-weather-rs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eas-weather-rs.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "eas-weather-rs.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.config.webserver.shutdown_timeout_secs | add 15 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "eas-weather-rs.fullname" . }}-config
            defaultMode: 0444
        - name: secrets
          secret:
            secretName: {{ .Values.secrets.secretName }}
      {{- if .Values.migrate.enabled }}
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/eas-weather-rs-migrate"]
          env:
            - name: EAS_WEATHER_RS__APP__CONFIG_FILE
              value: {{ printf "%s/%s" .Values.configFile.mountPath .Values.configFile.name | quote }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: config
              mountPath: {{ .Values.configFile.mountPath }}
              readOnly: true
            - name: secrets
              mountPath: {{ .Values.secrets.mountPath }}
              readOnly: true
      {{- end }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/eas-weather-rs-server"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: EAS_WEATHER_RS__APP__CONFIG_FILE
              value: {{ printf "%s/%s" .Values.configFile.mountPath .Values.configFile.name | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- $probes := dict "startupProbe" .Values.probes.startup "livenessProbe" .Values.probes.liveness "readinessProbe" .Values.probes.readiness }}
          {{- range $probeName, $probeCfg := $probes }}
          {{- if $probeCfg.enabled }}
          {{ $probeName }}:
            httpGet:
              path: {{ printf "%s%s" (trimSuffix "/" $.Values.config.webserver.base_path) $probeCfg.path }}
              port: http
            initialDelaySeconds: {{ $probeCfg.initialDelaySeconds }}
            periodSeconds: {{ $probeCfg.periodSeconds }}
            timeoutSeconds: {{ $probeCfg.timeoutSeconds }}
            failureThreshold: {{ $probeCfg.failureThreshold }}
          {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: config
              mountPath: {{ .Values.configFile.mountPath }}
              readOnly: true
            - name: secrets
              mountPath: {{ .Values.secrets.mountPath }}
              readOnly: true